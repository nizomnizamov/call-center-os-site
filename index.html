<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://piczmzrwogxzflwkacha.supabase.co; media-src 'self' blob: https://piczmzrwogxzflwkacha.supabase.co; connect-src 'self' https://piczmzrwogxzflwkacha.supabase.co wss://piczmzrwogxzflwkacha.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Call Center OS</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="sb.js"></script>
<style>
  .boot { min-height: 100vh; display: grid; place-items: center; font: 14px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #86868B; background: #F5F5F7; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .boot { background: #000; color: #98989D; } }
  :root[data-theme="dark"] .boot { background: #000; color: #98989D; }
  .boot i { display: block; width: 28px; height: 28px; margin: 0 auto 12px; border-radius: 50%;
            border: 3px solid currentColor; border-right-color: transparent; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="boot" id="boot"><div><i></i><span id="boot-msg">Panel yuklanmoqda…</span></div></div>
<script>
/* Qobiq: kirishni tekshiradi, panelni himoyalangan funksiyadan oladi va joyiga qo'yadi. */
CCOS.requireMember()
  .then(function () { return CCOS.loadPrivate("panel"); })
  .then(function (html) { CCOS.mount(html); CCOS.fillAccount(); })
  .catch(function (e) {
    document.getElementById("boot-msg").textContent =
      "Panelni yuklab bo'lmadi: " + CCOS.errText(e) + " Sahifani yangilang.";
  });
</script>
</body>
</html>
